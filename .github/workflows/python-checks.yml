name: Python checks

on:
  push:
    branches:
      - fix/security-audit-step-1
      - audit/kimguard-hardening
      - fix/chat-type-string-handling
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check application imports
        run: python -c "import antiraid, bot, captcha, common, linkutils, main, moderation, protection, textfilters"
